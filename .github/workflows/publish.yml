name: Publish

# Trusted Publishing (OpenID Connect) — no PyPI tokens are stored here.
# One-time setup per environment, in the PyPI project settings:
#   https://pypi.org/manage/project/actorio-cli/settings/publishing/
#   https://test.pypi.org/manage/project/actorio-cli/settings/publishing/
#   Publisher: GitHub, repo actorio-com/actorio-cli-mcp, workflow publish.yml.

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-test-pypi:
    name: Publish to TestPyPI (every main push)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (on version tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
