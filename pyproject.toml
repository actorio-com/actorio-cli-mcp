[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actorio-cli"
version = "0.1.0"
description = "CLI + MCP server for Actorio (NOT for PyPI)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "mcp>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
actorio = "actorio_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["actorio_cli*"]

[tool.pytest.ini_options]
python_files = "test_*.py tests.py"
testpaths = ["tests"]
asyncio_mode = "auto"
