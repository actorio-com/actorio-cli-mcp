[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "actorio-cli"
version = "0.1.0"
description = "CLI and MCP server for searching the Actorio product catalogue"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Actorio", email = "dev@actorio.com"},
]
keywords = ["actorio", "ecommerce", "amazon", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/actorio-com/actorio-cli-mcp"
Documentation = "https://github.com/actorio-com/actorio-cli-mcp#readme"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
actorio = "actorio_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["actorio_cli*"]

[tool.pytest.ini_options]
python_files = "test_*.py tests.py"
testpaths = ["tests"]
asyncio_mode = "auto"
